name: Refresh CDR Rates

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # lets you click "Run workflow" manually on GitHub too

permissions:
  contents: write            # needed to commit rates.json back to the repo

concurrency:
  group: data-commits        # the rates and RBA workflows never push at the same moment
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python cdr_rate_fetcher.py --output rates.json

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-refresh CDR rates"
          file_pattern: rates.json
